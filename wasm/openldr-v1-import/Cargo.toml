[package]
name = "openldr-v1-import"
edition.workspace = true
version.workspace = true
license.workspace = true
description = "OpenLDR v1 (SQL Server) -> FHIR R4 import source plugin"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde_json = "1"

# extism-pdk links wasm host imports that don't exist natively; restrict it to the wasm
# target so `cargo test` (native) builds the pure queries and mapping without it.
[target.'cfg(target_arch = "wasm32")'.dependencies]
extism-pdk = "1"
