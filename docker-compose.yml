# Local dev stack for the OpenLDR CE skeleton (health acceptance).
# Host ports avoid common sibling project defaults such as Postgres 5432,
# Keycloak/app servers on 8080, S3 storage 9010, and SQL Server 1433.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: openldr
      POSTGRES_PASSWORD: openldr
      POSTGRES_DB: openldr
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openldr"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - ./scripts/init-target-db.sql:/docker-entrypoint-initdb.d/10-init-target-db.sql:ro

  storage:
    image: ghcr.io/open-laboratory-data-repository/garage:v2.4.1@sha256:4e9ce31018a28a6e5bfcff89077b44195f6b192965277d1ba129b2e5cb891e77
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      # Dev-only fixed values, in the formats Garage requires. Never used by an installer.
      GARAGE_RPC_SECRET: 6465762d6f6e6c792d6761726167652d7270632d7365637265742d3030303031
      GARAGE_ADMIN_TOKEN: 6465762d6f6e6c792d6761726167652d61646d696e2d746f6b656e2d30303031
      GARAGE_DEFAULT_ACCESS_KEY: GK6f70656e6c64722d64657621
      GARAGE_DEFAULT_SECRET_KEY: 6465762d6f6e6c792d6761726167652d7365637265742d6b65792d3030303031
      GARAGE_DEFAULT_BUCKET: openldr
    volumes:
      - ./deploy/install/garage.toml:/etc/garage.toml:ro
      - storagedata:/var/lib/garage
    ports:
      - "9010:3900"
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    volumes:
      - ./infra/keycloak/openldr-realm.json:/opt/keycloak/data/import/openldr-realm.json:ro
      - ./deploy/keycloak/themes/openldr:/opt/keycloak/themes/openldr:ro
    ports:
      - "8180:8080"

  # Optional SQL Server target store. Off by default. Version + host port are configurable so you
  # can test each supported release (2017/2019/2022); start with e.g.:
  #   MSSQL_VERSION=2017 MSSQL_HOST_PORT=14330 docker compose --profile mssql up -d mssql
  mssql:
    image: mcr.microsoft.com/mssql/server:${MSSQL_VERSION:-2022}-latest
    profiles: ["mssql"]
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_PASSWORD:-Openldr_Local_2026!}
    ports:
      - "${MSSQL_HOST_PORT:-11433}:1433"

  # Optional MySQL warehouse target. Off by default; start with:
  #   docker compose --profile mysql up -d
  # Its reason to exist is `pnpm mysql:reports:accept`: the seeded mysql query variants had never
  # been run against a MySQL server through the pool a report actually gets, only by hand through
  # the CLI, which negotiates a different connection collation and hides the failure this catches.
  mysql:
    image: mysql:${MYSQL_VERSION:-8.4}
    profiles: ["mysql"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-Openldr_Local_2026!}
      MYSQL_DATABASE: openldr_target
    ports:
      - "${MYSQL_HOST_PORT:-13306}:3306"

  # Optional DHIS2 aggregate reporting target. Off by default; start with:
  #   pnpm dhis2:seed   (downloads the SL demo dump once)
  #   docker compose --profile dhis2 up -d
  dhis2-db:
    image: postgis/postgis:14-3.3
    profiles: ["dhis2"]
    environment:
      POSTGRES_USER: dhis
      POSTGRES_PASSWORD: dhis
      POSTGRES_DB: dhis2
    volumes:
      - ./.dhis2-seed/dump.sql.gz:/docker-entrypoint-initdb.d/10-dhis2.sql.gz:ro
  dhis2-web:
    image: dhis2/core:2.40.3
    profiles: ["dhis2"]
    depends_on: [dhis2-db]
    environment:
      DHIS2_HOME: /opt/dhis2
    volumes:
      - ./scripts/dhis2.conf:/opt/dhis2/dhis.conf:ro
    ports:
      - "8085:8080"

volumes:
  storagedata:
