<!doctype html>
<html lang="en"><head><meta charset="utf-8"><style>
*{box-sizing:border-box}html,body{margin:0;background:transparent}#scene{width:736px;height:416px;padding:16px;color:#eceef3;font:15px/1.6 Arial,sans-serif;background-color:#171717;background-image:radial-gradient(circle,#777 1px,transparent 1.15px);background-size:24px 24px;background-position:4px 4px}.window{height:100%;display:flex;flex-direction:column;border:1px solid #555962;border-radius:8px;overflow:hidden;background:#252b35;box-shadow:0 5px 12px #0003,0 1px 2px #0004}.titlebar{height:35px;flex:none;display:flex;justify-content:flex-end;align-items:stretch;background:linear-gradient(#333436,#2e2f31);border-bottom:1px solid #42464e}.control{position:relative;width:39px;display:flex;align-items:center;justify-content:center;color:#e1e3e7}.control:last-child{margin-right:3px}.minimize::before{content:"";width:10px;height:1px;background:currentColor}.maximize::before{content:"";width:10px;height:10px;border:1px solid currentColor;border-radius:1px}.close::before,.close::after{content:"";position:absolute;width:13px;height:1px;background:currentColor;transform:rotate(45deg)}.close::after{transform:rotate(-45deg)}.content{min-height:0;flex:1;overflow:hidden;background:linear-gradient(115deg,#282e39,#252b35)}.terminal{height:100%;padding:17px 19px 22px;color:#eceef3;font:15px/24px 'Cascadia Mono','SFMono-Regular',Consolas,'Liberation Mono',monospace;-webkit-font-smoothing:antialiased}.line{white-space:pre-wrap;overflow-wrap:anywhere;min-height:24px}.prompt,.user,.location{color:#cbd2df;font-weight:400}.cursor{display:inline-block;height:17px;width:1px;margin-left:2px;background:#eef0f4;vertical-align:-3px}.transcript{line-height:23px}.transcript .line{min-height:23px}.files-toolbar{height:51px;display:flex;align-items:center;gap:14px;padding:0 13px;border-bottom:1px solid #464a54}.arrows{display:flex;align-items:center;gap:13px;color:#c5cad3}.location-bar{flex:1;min-width:0;padding:5px 10px;border:1px solid #50545f;border-radius:4px;background:#232730b3;color:#e0e3e9;font-size:14px}.file-layout{display:grid;grid-template-columns:136px minmax(0,1fr);height:calc(100% - 51px)}.file-sidebar{padding:14px 8px;background:#20242d55;border-right:1px solid #464a54}.place{display:flex;gap:9px;align-items:center;padding:8px;color:#bbc3cf;border-radius:3px;font-size:13px}.place.selected{background:#52657e55;color:#e4eaf4}.file-list{padding:9px 15px}.file-head,.file-row{display:grid;grid-template-columns:minmax(0,1fr) 76px;gap:15px;align-items:center;height:39px;padding:0 9px}.file-head{height:29px;margin-bottom:5px;border-bottom:1px solid #464a54;color:#aeb8c8;font-size:12px}.name{display:flex;gap:12px;align-items:center}.file-row .type{color:#aeb8c8;font-size:12px}.folder{color:#c8af7f}.document{color:#b5bdca}svg{display:block;width:16px;height:16px;flex:none}
html,body{height:100%;background:#171717}body{display:grid;place-items:center}#scene{width:1120px;height:650px;position:relative;background-image:none;padding:24px}#scene:before{content:"";position:absolute;inset:0;background-image:radial-gradient(circle,#aaa6 1.25px,transparent 1.5px);background-size:12px 12px;mask-image:linear-gradient(to right,transparent,#000 24px,#000 calc(100% - 24px),transparent),linear-gradient(to bottom,transparent,#000 24px,#000 calc(100% - 24px),transparent);mask-composite:intersect;pointer-events:none}.window{position:relative}.terminal{font-size:20px;line-height:32px}.line{min-height:32px;width:fit-content;max-width:100%}</style></head><body><div id="scene"><div class="window"><div class="titlebar" aria-label="Window controls"><span class="control minimize" role="img" aria-label="Minimize"></span><span class="control maximize" role="img" aria-label="Maximize"></span><span class="control close" role="img" aria-label="Close"></span></div><div class="content"><div class="terminal"><div class="line" data-line="0">$ docker compose stop keycloak storage</div><div class="line" data-line="1">Keep PostgreSQL available for logical backups.</div><div class="line" data-line="2">Stop other jobs that write to these same stores.</div></div></div></div></div></body></html>
