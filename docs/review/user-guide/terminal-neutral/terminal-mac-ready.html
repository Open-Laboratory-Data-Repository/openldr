<!doctype html>
<html lang="en"><head><meta charset="utf-8"><style>
*{box-sizing:border-box}html,body{margin:0;background:transparent}#scene{position:relative;width:720px;height:400px;color:#e0e3e9;font:15px/1.5 Arial,sans-serif;overflow:hidden}#skin{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.content{position:absolute;left:5px;right:5px;top:34px;bottom:5px;overflow:hidden}.terminal{height:100%;padding:15px 13px;font:16px/24px 'Cascadia Mono',Consolas,'DejaVu Sans Mono',monospace;color:#e3e6eb}.line{white-space:pre-wrap;overflow-wrap:anywhere;min-height:24px}.prompt,.user,.location{color:inherit;font-weight:400}.cursor{display:inline-block;width:1px;height:19px;background:currentColor;vertical-align:-3px}.transcript{font-size:15px;line-height:23px}.transcript .line{min-height:23px}.files-toolbar{height:51px;display:flex;align-items:center;gap:14px;padding:0 13px;border-bottom:1px solid #464a54}.arrows{display:flex;align-items:center;gap:13px;color:#c5cad3}.location-bar{flex:1;min-width:0;padding:5px 10px;border:1px solid #50545f;border-radius:4px;background:#232730b3;color:#e0e3e9;font-size:14px}.file-layout{display:grid;grid-template-columns:136px minmax(0,1fr);height:calc(100% - 51px)}.file-sidebar{padding:14px 8px;background:#20242d55;border-right:1px solid #464a54}.place{display:flex;gap:9px;align-items:center;padding:8px;color:#bbc3cf;border-radius:3px;font-size:13px}.place.selected{background:#52657e55;color:#e4eaf4}.file-list{padding:9px 15px}.file-head,.file-row{display:grid;grid-template-columns:minmax(0,1fr) 76px;gap:15px;align-items:center;height:39px;padding:0 9px}.file-head{height:29px;margin-bottom:5px;border-bottom:1px solid #464a54;color:#aeb8c8;font-size:12px}.name{display:flex;gap:12px;align-items:center}.file-row .type{color:#aeb8c8;font-size:12px}.folder{color:#c8af7f}.document{color:#b5bdca}svg{display:block;width:16px;height:16px;flex:none}
</style></head><body><div id="scene"><img id="skin" src="approved-terminal.png" alt=""><div class="content"><div class="terminal "><div class="line"><span class="prompt">operator@Mac ~ % </span><span class="cursor"></span></div></div></div></div></body></html>
