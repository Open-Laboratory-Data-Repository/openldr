<style>
#preferences-evidence-guide { --dg-bg:light-dark(#fff,#171717); --dg-pane:light-dark(#fafafa,#1a1a1a); --dg-text:light-dark(#18181b,#fafafa); --dg-muted:light-dark(#71717a,#a0a0a0); --dg-border:light-dark(#e4e4e7,#2e2e2e); --dg-rule:light-dark(#eee,#242424); --dg-brand:#4682b4; --dg-link:light-dark(#276594,#73a9d5); --dg-wash:light-dark(#eaf0f6,#1e2a32); color:var(--dg-text); font:14px/1.6 Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; color-scheme:light dark; }
#preferences-evidence-guide * { box-sizing:border-box; }
#preferences-evidence-guide .dg-app { display:flex; flex-direction:column; height:var(--guide-preview-height,840px); min-height:0; border:1px solid var(--dg-border); background:var(--dg-bg); }
#preferences-evidence-guide .dg-head { display:flex; align-items:center; gap:16px; height:48px; padding:0 18px; flex-shrink:0; border-bottom:1px solid var(--dg-border); }
#preferences-evidence-guide .dg-head strong { font-size:16px; font-weight:600; }
#preferences-evidence-guide .dg-review { margin-left:12px; color:var(--dg-muted); font-size:12px; }
#preferences-evidence-guide .dg-head-icons { margin-left:auto; display:flex; align-items:center; gap:20px; color:var(--dg-muted); padding-right:80px; }
#preferences-evidence-guide .dg-main { display:flex; min-height:0; flex:1; }
#preferences-evidence-guide .dg-sidebar { width:256px; flex-shrink:0; display:flex; flex-direction:column; border-right:1px solid var(--dg-border); }
#preferences-evidence-guide .dg-search { height:48px; display:flex; align-items:center; gap:8px; padding:0 10px; border-bottom:1px solid var(--dg-border); flex-shrink:0; }
#preferences-evidence-guide .dg-search input { min-width:0; width:100%; border:1px solid var(--dg-border); border-radius:6px; padding:7px 10px; background:transparent; color:var(--dg-text); font:inherit; }
#preferences-evidence-guide .dg-docnav { overflow:auto; min-height:0; padding:4px 0 16px; }
#preferences-evidence-guide .dg-group { margin-top:5px; padding-top:8px; border-top:1px solid var(--dg-border); }
#preferences-evidence-guide .dg-group:first-child { border:0; margin:0; }
#preferences-evidence-guide .dg-group-label { display:block; padding:4px 12px; text-transform:uppercase; font-size:10px; color:var(--dg-muted); font-weight:600; letter-spacing:.03em; }
#preferences-evidence-guide .dg-navitem { display:block; padding:8px 12px; color:var(--dg-text); text-decoration:none; }
#preferences-evidence-guide .dg-selected { border-left:2px solid var(--dg-brand); background:var(--dg-wash); color:var(--dg-link); padding-left:10px; }
#preferences-evidence-guide .dg-content { min-width:0; flex:1; display:flex; flex-direction:column; }
#preferences-evidence-guide .dg-toolbar { display:flex; align-items:center; justify-content:flex-end; gap:12px; height:48px; flex-shrink:0; border-bottom:1px solid var(--dg-border); padding:0 12px; }
#preferences-evidence-guide .dg-version { font-size:12px; border:1px solid var(--dg-border); border-radius:6px; padding:4px 9px; color:var(--dg-muted); }
#preferences-evidence-guide .dg-version b { color:var(--dg-text); font-weight:500; }
#preferences-evidence-guide button { font:inherit; color:inherit; cursor:inherit; }
#preferences-evidence-guide .dg-iconbtn { border:0; background:none; padding:5px; display:inline-flex; align-items:center; border-radius:4px; color:var(--dg-muted); }
#preferences-evidence-guide .dg-iconbtn:hover { background:var(--dg-wash); }
#preferences-evidence-guide .dg-scroll { min-height:0; flex:1; overflow:auto; padding:24px; scroll-behavior:smooth; }
#preferences-evidence-guide .dg-columns { display:grid; grid-template-columns:minmax(0,1fr) 224px; gap:32px; align-items:start; }
#preferences-evidence-guide .dg-article { min-width:0; }
#preferences-evidence-guide h1 { font-size:24px; line-height:1.3; margin:0 0 12px; font-weight:600; }
#preferences-evidence-guide h2 { font-size:18px; font-weight:600; margin:30px 0 10px; padding-bottom:5px; border-bottom:1px solid var(--dg-rule); scroll-margin-top:12px; }
#preferences-evidence-guide h3 { font-size:15px; font-weight:500; margin:0 0 8px; }
#preferences-evidence-guide p { margin:8px 0; }
#preferences-evidence-guide .dg-meta { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:18px; color:var(--dg-muted); }
#preferences-evidence-guide .dg-meta span { border:1px solid var(--dg-border); border-radius:5px; padding:1px 7px; font-size:11px; }
#preferences-evidence-guide .dg-intro { color:var(--dg-muted); }
#preferences-evidence-guide .dg-example { border-left:2px solid var(--dg-brand); padding-left:12px; margin:18px 0; }
#preferences-evidence-guide .dg-example p { margin:4px 0; }
#preferences-evidence-guide .dg-onpage { position:sticky; top:0; color:var(--dg-muted); font-size:12px; }
#preferences-evidence-guide .dg-onpage > p { text-transform:uppercase; font-size:10px; letter-spacing:.03em; margin:5px 0 12px; }
#preferences-evidence-guide .dg-onpage a { display:block; color:inherit; text-decoration:none; padding:6px 0 6px 12px; border-left:2px solid transparent; }
#preferences-evidence-guide .dg-onpage a:hover,#preferences-evidence-guide .dg-onpage a[aria-current] { color:var(--dg-link); border-color:var(--dg-brand); }
#preferences-evidence-guide .dg-onpage small { display:block; font-size:11px; margin:24px 0 0 12px; }
#preferences-evidence-guide .dg-loop { margin:14px 0 22px; max-width:500px; }
#preferences-evidence-guide .dg-loop video { width:100%; display:block; border:1px solid var(--dg-border); border-radius:6px; background:#171717; }
#preferences-evidence-guide .dg-loop-control { display:flex; justify-content:space-between; align-items:center; gap:12px; color:var(--dg-muted); font-size:11px; margin-top:5px; }
#preferences-evidence-guide .dg-loop-control button { border:0; padding:3px 0; color:var(--dg-link); background:none; }
#preferences-evidence-guide .dg-step { padding:17px 0 18px; border-bottom:1px solid var(--dg-rule); }
#preferences-evidence-guide .dg-step:last-child { border-bottom:0; }
#preferences-evidence-guide .dg-number { color:var(--dg-muted); display:inline-block; min-width:22px; font-variant-numeric:tabular-nums; }
#preferences-evidence-guide .dg-step p { margin:4px 0 10px 22px; }
#preferences-evidence-guide .dg-shot { margin:10px 0 0 22px; max-width:500px; }
#preferences-evidence-guide .dg-shot button { display:block; width:100%; padding:0; border:1px solid var(--dg-border); border-radius:6px; overflow:hidden; background:#171717; }
#preferences-evidence-guide .dg-shot img { display:block; width:100%; max-height:300px; object-fit:contain; object-position:left center; }
#preferences-evidence-guide figcaption { color:var(--dg-muted); font-size:11px; margin-top:6px; }
#preferences-evidence-guide .dg-result { padding:12px 14px; border-left:2px solid var(--dg-brand); background:var(--dg-pane); margin:18px 0; }
#preferences-evidence-guide .dg-result p { margin:3px 0; }
#preferences-evidence-guide code { display:inline-block; max-width:100%; box-sizing:border-box; overflow-wrap:anywhere; font:12px/1.6 ui-monospace,monospace; background:var(--dg-pane); padding:2px 5px; border:1px solid var(--dg-border); border-radius:4px; }
#preferences-evidence-guide pre { margin:12px 0; padding:12px; background:var(--dg-pane); border:1px solid var(--dg-border); border-radius:6px; white-space:pre-wrap; overflow-wrap:anywhere; }
#preferences-evidence-guide pre code { background:none; border:0; padding:0; }
#preferences-evidence-guide .dg-config { display:grid; grid-template-columns:auto minmax(0,1fr); gap:6px 18px; margin:14px 0; }
#preferences-evidence-guide .dg-config dt { color:var(--dg-muted); }
#preferences-evidence-guide .dg-config dd { margin:0; }
#preferences-evidence-guide .dg-onpage .dg-subtoc { padding-left:24px; }
#preferences-evidence-guide details { padding:12px 0; border-bottom:1px solid var(--dg-rule); }
#preferences-evidence-guide summary { font-weight:500; cursor:inherit; }
#preferences-evidence-guide details p { color:var(--dg-muted); }
#preferences-evidence-guide .dg-return { color:var(--dg-link); text-decoration:none; display:inline-block; margin-top:22px; }
#preferences-evidence-guide .dg-lightbox { position:absolute; inset:0; z-index:20; background:rgba(0,0,0,.92); display:flex; align-items:center; justify-content:center; padding:40px 16px 16px; }
#preferences-evidence-guide .dg-lightbox img { max-width:100%; max-height:100%; object-fit:contain; }
#preferences-evidence-guide .dg-lightbox button { position:absolute; right:14px; top:8px; background:#242424; color:#fff; border:1px solid #555; border-radius:5px; padding:5px 10px; }
#preferences-evidence-guide .dg-app { position:relative; }
#preferences-evidence-guide [hidden] { display:none !important; }
#preferences-evidence-guide.dg-folded .dg-sidebar { display:none; }
@media(max-width:1279px) { #preferences-evidence-guide .dg-columns { grid-template-columns:minmax(0,1fr); } #preferences-evidence-guide .dg-onpage { display:none; } }
@media(max-width:600px) { #preferences-evidence-guide .dg-sidebar { display:none; } #preferences-evidence-guide .dg-scroll { padding:18px; } #preferences-evidence-guide .dg-head { padding:0 12px; } #preferences-evidence-guide .dg-head-icons { padding-right:0; gap:12px; } #preferences-evidence-guide .dg-review { display:none; } #preferences-evidence-guide .dg-shot { margin-left:0; } #preferences-evidence-guide .dg-step p { margin-left:0; } }
@media(prefers-reduced-motion:reduce) { #preferences-evidence-guide .dg-scroll { scroll-behavior:auto; } }
</style>

<script type="application/json" id="preferences-evidence-assets">__EVIDENCE_ASSETS__</script>
<script>
(() => {
 const root = document.getElementById('preferences-evidence-guide');
 const assets = JSON.parse(document.getElementById('preferences-evidence-assets').textContent);
 root.querySelectorAll('img[data-evidence]').forEach(img=>{img.loading='lazy';img.decoding='async';img.src=assets[img.dataset.evidence];});
 const pane = root.querySelector('[data-reading-pane]');
 let previewTheme='dark';
 function applyTheme(){root.style.colorScheme=previewTheme;root.querySelector('[data-theme-toggle]').setAttribute('aria-label','Switch to '+(previewTheme==='dark'?'light':'dark')+' mode');}
 applyTheme();
 root.querySelector('[data-theme-toggle]').addEventListener('click',()=>{previewTheme=previewTheme==='dark'?'light':'dark';applyTheme();});
 const box = root.querySelector('.dg-lightbox');
 let previousFocus = null;
 function closeBox() { box.hidden = true; root.querySelector('.dg-main').inert=false; if(previousFocus) previousFocus.focus(); }
 root.querySelector('[data-close-lightbox]').addEventListener('click', closeBox);
 root.addEventListener('keydown', event => { if(event.key==='Escape' && !box.hidden) closeBox(); if(event.key==='Tab' && !box.hidden) {event.preventDefault();box.querySelector('button').focus();} });
 root.querySelectorAll('[data-enlarge]').forEach(button => button.addEventListener('click', () => {
  previousFocus = button;
  const content = box.querySelector('[data-lightbox-content]');
  const frame = button.querySelector('.fc-screenshot');
  content.replaceChildren();
  content.className = frame ? 'dg-context-shot' : '';
  if(frame) {
   content.dataset.shotId = button.closest('[data-shot-id]').dataset.shotId;
   content.append(frame.cloneNode(true));
  } else {
   delete content.dataset.shotId;
   content.append(button.querySelector('img').cloneNode(true));
  }
  box.hidden = false;
  root.querySelector('.dg-main').inert=true;
  box.querySelector('button').focus();
 }));
 root.querySelectorAll('a[href^="#dg-"]').forEach(link => link.addEventListener('click', event => {
  const target = root.querySelector(link.getAttribute('href'));
  if(!target) return;
  event.preventDefault();
  pane.scrollTo({top:target.getBoundingClientRect().top-pane.getBoundingClientRect().top+pane.scrollTop-12,behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'instant':'smooth'});
  root.querySelectorAll('.dg-onpage a').forEach(item => item.removeAttribute('aria-current'));
  if(link.closest('.dg-onpage')) link.setAttribute('aria-current','location');
 }));
 root.querySelectorAll('[data-play-loop]').forEach(button => button.addEventListener('click', () => {
  const video=button.closest('figure').querySelector('video');
  if(video.paused) video.play().then(()=>button.textContent='Pause loop').catch(()=>button.textContent='Play loop');
  else {video.pause();button.textContent='Play loop';}
 }));
 root.querySelectorAll('.dg-loop').forEach(figure=>{
  const video=figure.querySelector('video');
  const button=figure.querySelector('[data-play-loop]');
  video.addEventListener('play',()=>{button.textContent='Pause loop';});
  video.addEventListener('pause',()=>{button.textContent='Play loop';});
  if(!matchMedia('(prefers-reduced-motion:reduce)').matches) {
   video.autoplay=true;
   video.play().catch(()=>{button.textContent='Play loop';});
  }
 });
 const expand = root.querySelector('[data-expand]');
 root.querySelector('[data-collapse]').addEventListener('click',()=>{root.classList.add('dg-folded');expand.hidden=false;});
 expand.addEventListener('click',()=>{root.classList.remove('dg-folded');expand.hidden=true;});
 root.querySelector('[data-search]').addEventListener('input',event=>{
  const query=event.target.value.trim().toLowerCase();
  root.querySelectorAll('.dg-navitem').forEach(item=>{item.hidden=!!query&&!item.textContent.toLowerCase().includes(query);});
 });

})();
</script>
