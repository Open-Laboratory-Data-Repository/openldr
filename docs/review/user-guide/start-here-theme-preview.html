<style>
#start-here-theme-preview { --preview-bg:#171717; --preview-fg:#fafafa; --preview-muted:#898989; --preview-border:#363636; --muted-foreground:var(--preview-muted); background:var(--preview-bg); color:var(--preview-fg); font:14px/1.6 Inter,Arial,sans-serif; }
#start-here-theme-preview[data-theme="light"] { --preview-bg:#fff; --preview-fg:#18181b; --preview-muted:#71717a; --preview-border:#d4d4d8; }
#start-here-theme-preview * { box-sizing:border-box; }
#start-here-theme-preview .theme-controls { display:flex; align-items:center; flex-wrap:wrap; gap:8px; padding:12px 14px; }
#start-here-theme-preview .theme-controls>span { margin-right:4px; color:var(--preview-muted); }
#start-here-theme-preview .theme-controls button { border:1px solid var(--preview-border); background:transparent; color:var(--preview-fg); border-radius:5px; padding:5px 13px; font:inherit; }
#start-here-theme-preview .theme-controls button[aria-pressed="true"] { background:#4682b4; color:#fff; border-color:#4682b4; }
#start-here-theme-preview figure { margin:0; }
#start-here-theme-preview figcaption { color:var(--preview-muted); font-size:12px; padding:5px 16px 0; }

@media(pointer:coarse) { #start-here-theme-preview .theme-controls button { min-height:44px; } }
[data-theme='dark'] {
  --doc-illustration-dot-opacity: 35%;
}

[data-theme='light'] {
  --doc-illustration-dot-opacity: 95%;
}

.doc-dotted-frame {
  position: relative;
  display: block;
  padding: 24px;
}

/* Remove the PNG's transparent 16px margin without changing the source image. */
.doc-dotted-window {
  position: relative;
  display: block;
  overflow: hidden;
  aspect-ratio: 704 / 384;
  border-radius: 6px;
}

.doc-dotted-window > img {
  position: absolute;
  left: -2.272727%;
  top: -4.166667%;
  display: block;
  width: 104.545455%;
  max-width: none;
  height: 108.333333%;
  margin: 0;
}

.doc-dotted-dots {
  position: absolute;
  inset: 0;
  pointer-events: none;
  background-image: radial-gradient(circle, color-mix(in srgb, var(--muted-foreground) var(--doc-illustration-dot-opacity, 95%), transparent) 1.25px, transparent 1.5px);
  background-size: 12px 12px;
  background-repeat: round;
  mask-image:
    linear-gradient(to right, transparent, #000 24px, #000 calc(100% - 24px), transparent),
    linear-gradient(to bottom, transparent, #000 24px, #000 calc(100% - 24px), transparent);
  mask-composite: intersect;
}

</style>

<script>
(() => {
 const root=document.getElementById('start-here-theme-preview');
 const apply=theme=>{
  if(theme!=='light'&&theme!=='dark')return;
  root.dataset.theme=theme;
  root.querySelectorAll('[data-preview-theme]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.previewTheme===theme)));
 };
 apply(globalThis.openai?.widgetState?.modelContent?.illustrationTheme || 'dark');
 root.querySelectorAll('[data-preview-theme]').forEach(button=>button.addEventListener('click',()=>{
  const theme=button.dataset.previewTheme;apply(theme);
  if(globalThis.openai?.setWidgetState)globalThis.openai.setWidgetState({modelContent:{illustrationTheme:theme},privateContent:null}).catch(()=>{});
 }));
 window.addEventListener('openai:set_globals',event=>apply(event.detail?.globals?.widgetState?.modelContent?.illustrationTheme));
})();
</script>
